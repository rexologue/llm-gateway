# Central observability and session state for the whole fleet.
#
# This stack runs ONCE, on one machine. Everything reaches it by push - logs to
# Loki, traces over OTLP, metrics from each machine's vmagent to VictoriaMetrics,
# sessions to Valkey - so it never needs to know where the gateways are, and a
# new machine joins by pointing its .env here. Splitting it out of the
# gateway stack is what lets one session survive a round-robin balancer: all
# gateways append to the same Valkey record, so a dialog whose turns landed on
# different machines is still one transcript.
#
# Valkey is here rather than in deploy/gateway because it must be shared. A
# gateway deployed without this stack keeps proxying - it just records nothing.
#
# Ports are published on OBSERVABILITY_HOST, which must be an address the engine
# machines can reach. None of these services authenticate by default: keep them
# on a private network, and set `requirepass` in configs/valkey.conf, since the
# session store holds full dialog text.
#
# Every service that keeps data runs as OBSERVABILITY_RUN_AS instead of its
# image's own user, so one user owns every volume whatever storage is under it.
# See OBSERVABILITY_RUN_AS in .env.example for what the volume directories need.

services:
  valkey:
    image: ${OBSERVABILITY_VALKEY_IMAGE}
    container_name: ${OBSERVABILITY_VALKEY_CONTAINER_NAME}
    restart: unless-stopped
    user: "${OBSERVABILITY_RUN_AS}"
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]

    ports:
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_VALKEY_PORT}:6379"

    volumes:
      - ./configs/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - "${OBSERVABILITY_VALKEY_VOLUME}:/data"

    networks:
      - observability


  loki:
    image: ${OBSERVABILITY_LOKI_IMAGE}
    container_name: ${OBSERVABILITY_LOKI_CONTAINER_NAME}
    restart: unless-stopped
    user: "${OBSERVABILITY_RUN_AS}"
    command: ["-config.file=/etc/loki/local-config.yaml"]

    ports:
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_LOKI_HTTP_PORT}:3100"

    volumes:
      - ./configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - "${OBSERVABILITY_LOKI_VOLUME}:/loki"

    networks:
      - observability


  victoria-metrics:
    image: ${OBSERVABILITY_VM_IMAGE}
    container_name: ${OBSERVABILITY_VM_CONTAINER_NAME}
    restart: unless-stopped
    user: "${OBSERVABILITY_RUN_AS}"

    # Receives the metrics every machine's vmagent pushes to /api/v1/write and
    # answers Grafana as a Prometheus datasource on the same port.
    command:
      - "-storageDataPath=/storage"
      - "-retentionPeriod=${OBSERVABILITY_VM_RETENTION}"
      - "-httpListenAddr=:8428"

    ports:
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_VM_HTTP_PORT}:8428"

    volumes:
      - "${OBSERVABILITY_VM_VOLUME}:/storage"

    networks:
      - observability


  tempo:
    image: ${OBSERVABILITY_TEMPO_IMAGE}
    container_name: ${OBSERVABILITY_TEMPO_CONTAINER_NAME}
    restart: unless-stopped
    user: "${OBSERVABILITY_RUN_AS}"
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]

    ports:
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_TEMPO_HTTP_PORT}:3200"

    volumes:
      - ./configs/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - "${OBSERVABILITY_TEMPO_VOLUME}:/var/tempo"

    networks:
      - observability


  otel-collector:
    image: ${OBSERVABILITY_OTEL_COLLECTOR_IMAGE}
    container_name: ${OBSERVABILITY_OTEL_COLLECTOR_CONTAINER_NAME}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]

    depends_on:
      tempo:
        condition: service_started

    ports:
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_OTEL_GRPC_PORT}:4317"
      - "${OBSERVABILITY_HOST}:${OBSERVABILITY_OTEL_HEALTH_PORT}:13133"

    volumes:
      - ./configs/otel-collector.yaml:/etc/otelcol/config.yaml:ro

    networks:
      - observability


networks:
  observability:
    driver: bridge
