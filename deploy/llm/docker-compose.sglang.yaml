services:
  sglang:
    image: ${LLM_SGLANG_IMAGE}
    container_name: ${LLM_SGLANG_CONTAINER_NAME}
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command: ["bash /serve_sglang.sh"]
    runtime: nvidia
    ipc: host
    shm_size: ${LLM_SGLANG_SHM_SIZE}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:30000/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

    ports:
      - "${LLM_HOST}:${LLM_HTTP_PORT}:30000"

    volumes:
      - ${LLM_SGLANG_MODEL_PATH}:/model:ro
      - ./serve_sglang.sh:/serve_sglang.sh:ro
      - sglang-crash-dumps:/tmp/sglang_crash_dump

    networks:
      - llm


  llm-smoke-tests:
    profiles: ["test"]
    image: ${LLM_SMOKE_TESTS_IMAGE}

    depends_on:
      sglang:
        condition: service_healthy

    env_file:
      - path: .env
        required: false

    environment:
      BASE_URL: http://sglang:30000

    # The backend speaks only the OpenAI-compatible contract; session
    # persistence is a gateway feature and is verified by the gateway stack.
    command: ["pytest", "-q", "tests/smoke/test_backend_contract.py"]

    networks:
      - llm


  llm-node-exporter:
    image: ${LLM_NODE_EXPORTER_IMAGE}
    container_name: ${LLM_NODE_EXPORTER_CONTAINER_NAME}
    restart: unless-stopped
    network_mode: host
    pid: host

    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - "--web.listen-address=:${LLM_NODE_EXPORTER_PORT}"

    volumes:
      - /:/host:ro,rslave


  llm-dcgm-exporter:
    image: ${LLM_DCGM_EXPORTER_IMAGE}
    container_name: ${LLM_DCGM_EXPORTER_CONTAINER_NAME}
    restart: unless-stopped
    runtime: nvidia

    networks:
      - llm


  # Pushes this machine's node and GPU metrics to the central VictoriaMetrics,
  # so the central side never needs this machine's address. One per machine,
  # like node-exporter: the engine's own metrics travel with its gateway
  # (deploy/gateway, gateway-vmagent). While the central side is down it
  # buffers in memory and then drops samples, never blocking a scrape.
  llm-vmagent:
    image: ${LLM_VMAGENT_IMAGE}
    container_name: ${LLM_VMAGENT_CONTAINER_NAME}
    restart: unless-stopped

    command:
      - "-promscrape.config=/etc/vmagent/scrape.yaml"
      - "-remoteWrite.url=${LLM_METRICS_PUSH_URL}"
      - "-remoteWrite.disableOnDiskQueue"
      - "-remoteWrite.dropSamplesOnOverload"
      # Written to only on graceful shutdown; RAM, so nothing lands on disk.
      - "-remoteWrite.tmpDataPath=/vmagent-data"
      - "-httpListenAddr=:8429"

    environment:
      HOST_ID: ${LLM_HOST_ID}
      NODE_EXPORTER_PORT: ${LLM_NODE_EXPORTER_PORT}

    # node-exporter runs in the host network namespace; this reaches it there.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./configs/vmagent.yaml:/etc/vmagent/scrape.yaml:ro

    tmpfs:
      - /vmagent-data:size=64m

    networks:
      - llm


volumes:
  sglang-crash-dumps:


networks:
  llm:
    driver: bridge
